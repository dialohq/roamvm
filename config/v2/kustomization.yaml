apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../crd
  - install.yaml
patches:
  - target:
      kind: CustomResourceDefinition
      name: virtualmachines.vm.roamvm.io
    patch: |-
      - op: replace
        path: /metadata/name
        value: virtualmachines.v2.vm.roamvm.io
      - op: replace
        path: /spec/group
        value: v2.vm.roamvm.io
      - op: replace
        path: /spec/names/shortNames
        value: [rvm2]
      - op: remove
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/hibernate/x-kubernetes-validations
      - op: replace
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/cloneFrom/x-kubernetes-validations
        value:
          - rule: self == oldSelf
            message: cloneFrom is immutable
