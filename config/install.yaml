apiVersion: v1
kind: Namespace
metadata:
  name: roamvm-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: roamvm-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: roamvm-runtime
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: roamvm-controller
rules:
- apiGroups: [vm.roamvm.io]
  resources: [virtualmachines, virtualmachines/status, virtualmachines/finalizers]
  verbs: [get, list, watch, update, patch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [persistentvolumeclaims]
  verbs: [get, list, watch, update, patch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election
  namespace: roamvm-system
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-election
  namespace: roamvm-system
subjects:
- kind: ServiceAccount
  name: controller
  namespace: roamvm-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-election
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: roamvm-controller
subjects:
- kind: ServiceAccount
  name: controller
  namespace: roamvm-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: roamvm-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: roamvm-daemon
rules:
- apiGroups: [vm.roamvm.io]
  resources: [virtualmachines]
  verbs: [get]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, update, patch]
- apiGroups: [""]
  # Existing runner Pods still use token Secrets until their next cold start.
  resources: [secrets, persistentvolumeclaims]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roamvm-daemon
  namespace: default
subjects:
- kind: ServiceAccount
  name: roamvm-runtime
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: roamvm-daemon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: roamvm-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: roamvm-controller}
  template:
    metadata:
      labels: {app: roamvm-controller}
    spec:
      serviceAccountName: controller
      containers:
      - name: controller
        image: roamvm:dev
        imagePullPolicy: IfNotPresent
        args: [controller]
        env:
        - name: RUNNER_IMAGE
          value: roamvm:dev
        - name: GOMEMLIMIT
          value: 128MiB
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 256Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
        livenessProbe:
          httpGet: {path: /healthz, port: 8081}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: state
  namespace: roamvm-system
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: state
  namespace: roamvm-system
subjects:
- kind: ServiceAccount
  name: roamvm-runtime
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: state
