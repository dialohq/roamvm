name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lab-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c make libvirt-check
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c make fmt-check test generate
      - run: git diff --exit-code -- api config/crd
      - run: docker compose -f test/lab/compose.yaml config --quiet
      - run: docker build -t roamvm:ci .
