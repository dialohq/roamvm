name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y qemu-utils qemu-system-x86
      - run: make fmt-check test generate
      - run: git diff --exit-code -- api config/crd
      - run: docker compose -f test/lab/compose.yaml config --quiet
      - run: docker build -t roamvm:ci .
