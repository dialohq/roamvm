apiVersion: v1
kind: ServiceAccount
metadata:
  name: roamvm-orb-provider
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roamvm-orb-provider
  namespace: default
rules:
- apiGroups: [v2.vm.roamvm.io]
  resources: [virtualmachines]
  verbs: [get, create, patch, delete]
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roamvm-orb-provider
  namespace: default
subjects:
- kind: ServiceAccount
  name: roamvm-orb-provider
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: roamvm-orb-provider
