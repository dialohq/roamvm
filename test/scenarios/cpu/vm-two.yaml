apiVersion: vm.roamvm.io/v1alpha1
kind: VirtualMachine
metadata:
  name: scenario-cpu-two
  namespace: default
spec:
  powerState: Running
  cpus: 4
  memory: 256Mi
  readinessPort: 8080
  nodeSelector:
    kubernetes.io/hostname: ${ROAMVM_TEST_NODE}
  resources:
    requests:
      cpu: 500m
    limits:
      cpu: "4"
