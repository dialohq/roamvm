apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../config
secretGenerator:
  - name: roamvm-object-store
    namespace: default
    envs: [store.env]
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: controller
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller
      spec:
        template:
          spec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
