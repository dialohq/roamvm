name: roamvm-test
services:
  registry:
    image: registry:3.0.0
    ports: ["127.0.0.1:15001:5000"]
    volumes: ["registry:/var/lib/registry"]
    networks: [kind]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:5000/v2/]
      interval: 2s
      timeout: 2s
      retries: 30
  s3:
    image: roamvm-test-store:dev
    command: minio server /data --address :9000
    environment:
      MINIO_ROOT_USER: roamvm-local
      MINIO_ROOT_PASSWORD: roamvm-local-test-only
    ports: ["127.0.0.1:19001:9000"]
    volumes: ["s3:/data"]
    networks: [kind]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 2s
      retries: 30
  bucket:
    image: roamvm-test-store:dev
    profiles: [init]
    depends_on:
      s3: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - mc alias set lab http://s3:9000 roamvm-local roamvm-local-test-only; mc mb --ignore-existing lab/roamvm
    networks: [kind]
volumes:
  registry:
  s3:
networks:
  kind:
    external: true
